<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/truble.ico" type="image/x-icon">
  <link rel="shortcut icon" href="img/truble.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
  <title>命運抽籤轉盤</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      color: #fff;
      background-color: #111213;
      background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    #fishCanvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0; 
      pointer-events: auto;
    }
    @font-face {
      font-family: 'YuPearl';
      src: url('ttf/YuPearl-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Roboto';
      src: url('ttf/Roboto-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'NaniFont-Regular';
      src: url('ttf/NaniFont-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 50px;
      margin-top: 40px; 
    }
    .wheel-container {
      position: relative;
    }
    #wheel {
      font-family: 'Roboto', sans-serif;
      width: 300px;
      height: 300px;
      border: 4px solid #fff;
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 1px 15px rgba(0, 0, 0, 0.6);
    }
    .arrow {
      position: absolute;
      top: -20px;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 30px solid #617dbf;
      transform: translateX(-50%) rotate(180deg); 
      filter: drop-shadow(0 -8px 3px rgba(0, 0, 0, 0.9));
      z-index: 2;
    }
    textarea {
      background-color: rgba(227, 227, 227, 0.75);
      border: 1px solid #000;
      border-radius: 3px;
      width: 200px;
      height: 150px;
      resize: none;
      position: relative;
      z-index: 9000;
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -2px -6px 5px rgba(255, 255, 255, 0.4);
    }
    textarea::placeholder {
      color: #444241; 
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    button {
      font-family: 'Roboto', 'YuPearl', sans-serif;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.4), inset -2px -6px 5px rgba(0, 0, 0, 0.6);
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0px 2px 3px rgba(0, 0, 0, 0.4), inset 0px 1px 3px rgba(0, 0, 0, 0.6);
    }
    #spinButton {
      margin-top: 20px;
      background-color: #238547;
      z-index: 20;
    }
    #spinButton:hover {
      background-color: #2a9e60;
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }
    #spinButton:active {
      background-color: #1f6e3e;
      transform: scale(0.98);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    #updateButton {
      background-color: #2196f3;
      z-index: 10;
    }
    #updateButton:hover {
      background-color: #42a5f5;
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }
    #updateButton:active {
      background-color: #1e88e5; 
      transform: scale(0.98);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    #clock {
      font-size: 18px;
      margin-top: 20px;
      line-height: 1.5; 
    }
    @font-face {
      font-family: 'Sangyo';
      src: url('ttf/sangyo.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    #timeDisplay {
      font-family: 'Sangyo', Arial, sans-serif;
      margin-top: 20px;              
      padding: 10px 20px;
      font-size: 18px; 
      text-align: center;  
      color: #fff;  
      background-color: #192e3a; 
      border-radius: 8px;  
      box-shadow: inset 0px 2px 5px rgba(0, 0, 0, 0.7);
      width: fit-content;     
      margin-left: auto;          
      margin-right: auto;
    }
    .result {
      background-color: #008000;
      color: #fff;
      font-size: 34px;
      border-radius: 15px;
      padding: 10px 20px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
    }
    #resultBox {
      position: absolute !important;
      top: 425px !important; 
      width: 270px; 
      height: 40px; 
      text-align: center; 
      background-color: rgba(78, 125, 104, 1); 
      border: 2px solid #333;  
      border-radius: 10px; 
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
      font-size: 36px; 
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      display: none; 
      z-index: 10;
    }
    .template-buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .template-buttons button {
      padding: 10px 15px;
      background-color: #24367d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
    }
    .template-buttons button:hover {
      background-color: #384a91;
    }
    #page-title {
      display: flex;
      justify-content: center;
      align-items: center; 
      font-size: 2em;
      font-weight: bold;
      padding: 10px;
      width: 100%;
      margin: 0 auto; 
      position: relative;
    }
    #audio-control-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 20px; 
    }
    #volume-slider {
      width: 90px;
      height: 6px;
      cursor: pointer;
    }
    #bgm-button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background-color: rgba(79, 101, 121, 0.3);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 0; 
      margin: 0; 
      line-height: 18px;
      box-shadow: 0 4px 6px rgba(0, 6, 8, 0.7);
      transition: all 0.2s ease;
    }
    #bgm-button:hover {
      background-color: rgba(92, 126, 158, 0.3);
      box-shadow: 0 4px 6px rgba(0, 6, 8, 0.7);
    }
    .transparent-btn {
      position: relative; 
      font-size: 18px!important;
      background: transparent;
      border-radius: 50%;
      box-shadow: inset 0px 1px 3px rgba(255, 255, 255, 0.4), inset 0px -1px 2px rgba(0, 0, 0, 0.4), 0px 4px 6px rgba(0, 0, 0, 0.2);
      color: #fff;
      padding: 10px;
      cursor: pointer;
      border: none;
      width: 40px;
      height: 40px;
      font-size: 1.5em;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }
    .transparent-btn:last-child {
      margin-right: 0;
    }
    .transparent-btn:hover {
      transform: scale(1.1);
      box-shadow: inset 0px 2px 4px rgba(255, 255, 255, 0.8), inset 0px -3px 5px rgba(0, 0, 0, 0.4), 0px 8px 10px rgba(0, 0, 0, 0.4);
    }
    .transparent-btn:active {
      transform: scale(0.95);
      box-shadow: 0px 2px 3px rgba(0, 0, 0, 0.4), inset 0px 1px 3px rgba(0, 0, 0, 0.6);
    }
    .palette-container {
      position: absolute;
      top: 100%; 
      left: 0;
      margin-top: 5px; 
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      z-index: 1000;
    }
    .palette-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      padding: 0; 
      margin: 0; 
      box-shadow: inset 0px 1px 3px rgba(255, 255, 255, 0.6), inset 0px -1px 2px rgba(0, 0, 0, 0.3), 0px 4px 6px rgba(0, 0, 0, 0.2);
      background: transparent;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .palette-btn:hover {
      transform: scale(1.1);
    }
    .palette-btn:active {
      transform: scale(0.9);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    .palette-btn[data-palette="green"] {
      background: linear-gradient(135deg, #7cc396, #5aa575);
    }
    .palette-btn[data-palette="pink"] {
      background: linear-gradient(135deg, #FF8FC1, #f9d0e2);
    }
    .palette-btn[data-palette="blue"] {
      background: linear-gradient(135deg, #54A8C3, #7aadbe);
    }
    .palette-btn[data-palette="yellow"] {
      background: linear-gradient(135deg, #FFD700, #FFA500);
    }
    .palette-btn[data-palette="gray"] {
      background: linear-gradient(135deg, #FFFFFF, #E0E0E0);
    }
    .palette-btn[data-palette="red"] {
      background: linear-gradient(135deg, #8B0000, #FF0000);
    }
    .hidden {
      display: none;
    }
    /* A fixed metal housing surrounds the rotating SVG, keeping the pointer accurate. */
    body { background: radial-gradient(ellipse at 25% 10%, #243f44, transparent 65%), #101c25; color: #eef3f1; padding: 28px 20px 60px; box-sizing: border-box; }
    #fishCanvas { opacity: .35; }
    #page-title { box-sizing: border-box; gap: 10px; flex-wrap: wrap; font-size: clamp(24px, 4vw, 32px); letter-spacing: .04em; }
    .container { position: relative; gap: 60px; margin: 42px auto 0; max-width: 1000px; align-items: center; }
    .wheel-container { width: min(380px, 100%); }
    .wheel-stage { position: relative; width: 100%; padding-bottom: 16px; isolation: isolate; }
    .wheel-rim { position: relative; box-sizing: border-box; width: 100%; aspect-ratio: 1; padding: 18px; border-radius: 50%; background: conic-gradient(from -30deg, #715735, #f4deb0 12%, #b59158 28%, #5e472b 42%, #dcc392 60%, #fff0cb 77%, #8a693d 92%, #715735); box-shadow: 0 2px 0 #f9e7bd inset, 0 -3px 0 #694f2d inset, 0 5px 0 #80623d, 0 10px 0 #4d3d29, 0 15px 0 #2c2924, 0 30px 38px #0008; }
    .wheel-rim::before { content: ''; position: absolute; inset: 8px; border: 1px solid #fff2; border-radius: 50%; pointer-events: none; }
    #wheel { display: block; width: 100%; height: 100%; border: 0; border-radius: 50%; background: #244943; box-shadow: 0 0 0 3px #3a3329, 0 0 0 5px #e2c58d; }
    #wheel text { font-weight: 600; paint-order: stroke; stroke: #ffffff12; stroke-width: .4px; }
    .wheel-gloss { position: absolute; inset: 18px; border-radius: 50%; pointer-events: none; background: linear-gradient(135deg, #ffffff42 0, transparent 40%, #00000012 65%, #00000055 100%); box-shadow: inset 0 3px 8px #fff5, inset 0 -8px 20px #0006; }
    .wheel-hub { position: absolute; width: 18%; aspect-ratio: 1; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; pointer-events: none; background: linear-gradient(145deg, #fff0c8, #b58c4c 52%, #654d2d); box-shadow: 0 2px 1px #ffedc9 inset, 0 -3px 2px #694923 inset, 0 5px 0 #4e412e, 0 9px 12px #0007; }
    .wheel-hub span { display: grid; place-items: center; width: 72%; height: 72%; border-radius: 50%; background: linear-gradient(145deg, #355b59, #172f33); box-shadow: inset 0 1px 2px #0008, 0 1px 0 #ffedb888; color: #e9cb8e; font-size: 28px; }
    .arrow { top: -12px; border: 0; width: 30px; height: 48px; background: linear-gradient(110deg, #fff0c4, #d6ae65 50%, #977039); clip-path: polygon(10% 0, 90% 0, 100% 30%, 50% 100%, 0 30%); transform: translateX(-50%); filter: drop-shadow(0 4px 3px #0009); z-index: 3; }
    .options-container { box-sizing: border-box; width: 320px; max-width: 100%; padding: 24px; border: 1px solid #49605f; border-radius: 20px; background: #192f36ed; box-shadow: 0 18px 45px #0003; }
    textarea { box-sizing: border-box; width: 100%; height: 170px; padding: 14px; border: 1px solid #4a6363; border-radius: 12px; color: #edf4f2; background: #11262d; box-shadow: inset 0 2px 5px #0003; font: 16px/1.7 system-ui, sans-serif; z-index: 1; margin-bottom: 14px; }
    textarea::placeholder { color: #a1b6b7; }
    button { font-size: 17px; border: 1px solid #ffffff18; box-shadow: 0 2px 0 #0004; transition: background .2s, transform .2s; }
    #spinButton { background: linear-gradient(#e9cd94, #c4a363); color: #263735; font-weight: bold; border-color: #f3dca9; margin: 16px auto 0; width: 80%; box-shadow: 0 4px 0 #77603b, 0 9px 18px #0004; }
    #spinButton:hover { background: linear-gradient(#f7dfac, #d6b574); transform: translateY(-2px); }
    #spinButton:disabled { transform: none; }
    #updateButton { background: #356360; }
    #updateButton:hover { background: #477a74; }
    .template-buttons { flex-wrap: wrap; gap: 8px; margin-top: 0; }
    .template-buttons button { flex: 1; padding: 9px 8px; background: #253f4a; font-size: 14px; white-space: nowrap; border-radius: 8px; }
    .template-buttons button:hover { background: #365866; }
    #timeDisplay { color: #a8bebd; background: transparent; box-shadow: none; font-size: 15px; line-height: 1.6; }
    #audio-control-container { gap: 10px; padding: 8px 12px; border: 1px solid #3d555a; border-radius: 30px; background: #152a32; }
    #sfx-button { font: 13px system-ui, sans-serif; padding: 7px 10px; background: #263c44; border: 1px solid #52666b; border-radius: 18px; color: #c3d0d0; box-shadow: none; white-space: nowrap; }
    #sfx-button[aria-pressed="true"] { background: #3c574b; color: #f4dfaf; border-color: #baa271; }
    #resultBox { position: fixed !important; top: auto !important; bottom: 24px; width: max-content; max-width: calc(100vw - 64px); height: auto; min-height: 42px; box-sizing: border-box; padding: 14px 24px; font-size: clamp(22px, 4vw, 32px); background: #244b43; border-color: #bfa775; z-index: 100; }
    :focus-visible { outline: 2px solid #e9cd94; outline-offset: 4px; }
    @media (max-width: 600px) { body { padding: 20px 16px 90px; } .container { margin-top: 32px; gap: 32px; } .wheel-container { width: min(340px, 100%); } #audio-control-container { margin: 6px 0 0; } .options-container { width: 100%; max-width: 380px; padding: 20px; } }

    [hidden] { display: none !important; }
    .wheel-container > .buttons { flex-direction: row; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
    .wheel-container > .buttons #spinButton { margin: 0; flex: 1; }
    #dice-controls { flex: 0 0 auto; color: #c5d8d4; font: 14px system-ui; }
    #dice-count { width: 48px; padding: 10px 6px; border: 1px solid #66847c; border-radius: 8px; background: #142d31; color: white; font: 17px system-ui; }
    .game-stage { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; perspective: 1000px; }
    .coin-scene { background: radial-gradient(ellipse at 50% 75%, #b68b3730, transparent 65%); }
    .coin-scene::after { content: ''; position: absolute; width: 52%; height: 8%; bottom: 10%; background: #0007; border-radius: 50%; filter: blur(10px); }
    .coin-3d { width: 55%; aspect-ratio: 1; position: relative; transform-style: preserve-3d; z-index: 1; }
    .coin-face, .coin-edge { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; }
    .coin-face { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 5px solid #cfa44e; box-sizing: border-box; color: #654417; background: radial-gradient(circle at 30% 20%, #fff0bf, #dfb65e 50%, #ad752e); box-shadow: inset 0 0 0 3px #ffe7a8, inset 0 0 0 7px #ad813d, inset 0 0 20px #80531c55; text-shadow: 0 1px #fff1c8; font: 600 25px system-ui; }
    .coin-face b { font-size: 54px; line-height: 1.3; }
    .coin-face small { font-size: 10px; letter-spacing: .22em; margin-top: 8px; }
    .coin-heads { transform: translateZ(5px); }
    .coin-tails { transform: rotateY(180deg) translateZ(5px); background: radial-gradient(circle at 30% 20%, #fff4ce, #d0a24e 55%, #956527); }
    .coin-edge { background: #be9347; backface-visibility: visible; }
    .glass-scene { border-radius: 50%; background: radial-gradient(ellipse at 50% 65%, #39635b, #142f33 68%); box-shadow: inset 0 -10px 20px #0006, 0 8px 0 #8d7751, 0 14px 0 #3d3e32, 0 26px 35px #0006; }
    .glass-scene::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #d7f5f180; background: radial-gradient(ellipse at 27% 16%, #fff7, transparent 24%), linear-gradient(125deg, #ffffff14, transparent 45%, #b9e7ed14); box-shadow: inset 5px 6px 14px #edfffa38, inset -4px -5px 12px #a8dbda30; pointer-events: none; z-index: 3; }
    .die-slot { position: absolute; width: 13%; aspect-ratio: 1; transform: translate(-50%, -50%); perspective: 600px; }
    .die { --size: 44px; width: var(--size); height: var(--size); position: relative; transform-style: preserve-3d; }
    .die-face { position: absolute; inset: 0; border: 1px solid #baad92; border-radius: 7px; background: linear-gradient(135deg, #fffef1, #ddd5bc); display: grid; grid-template: repeat(3,1fr) / repeat(3,1fr); padding: 7px; gap: 3px; box-sizing: border-box; backface-visibility: hidden; box-shadow: inset 0 0 5px #a9956955; }
    .pip { border-radius: 50%; background: #29473f; box-shadow: inset 0 1px 2px #0009; }
    .die-face[data-value="1"] .pip { background: #a9554d; }
    .game-status { min-height: 28px; margin: 18px 0 0; color: #eddbaf; font: 16px/1.6 system-ui; }
    @media(max-width:400px) { .die { --size: 36px; } .die-face { padding: 5px; gap: 2px; } }
  </style>
</head>
<body>
  <canvas id="fishCanvas"></canvas>
  <h1 id="page-title">
    <div id="color-palette-wrapper" style="position: relative;">
      <button id="color-palette-btn" class="transparent-btn">🎨</button>
      <div id="color-palette-container" class="palette-container hidden">
        <button class="palette-btn" data-palette="green"></button>
        <button class="palette-btn" data-palette="pink"></button>
        <button class="palette-btn" data-palette="blue"></button>
        <button class="palette-btn" data-palette="yellow"></button>
        <button class="palette-btn" data-palette="gray"></button>
        <button class="palette-btn" data-palette="red"></button>
      </div>
    </div>
    抽籤轉盤
    <div id="audio-control-container">
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
      <button id="bgm-button" aria-label="播放或暫停音樂">♫</button>
      <button id="sfx-button" type="button" aria-pressed="false" aria-label="歡呼音效" title="開啟或關閉抽中後的歡呼聲">音效：關</button>
    </div>
  </h1>
  <div class="container">
    <div class="wheel-container">
      <div class="wheel-stage">
        <div class="arrow"></div>
        <div class="wheel-rim">
          <svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="抽籤轉盤"></svg>
          <div class="wheel-gloss" aria-hidden="true"></div>
          <div class="wheel-hub" aria-hidden="true"><span>✦</span></div>
        </div>
      </div>
      <div id="coin-stage" class="game-stage coin-scene" hidden aria-label="3D硬幣">
        <div class="coin-3d" id="coin-3d">
          <div class="coin-edge" style="transform:translateZ(-4px)"></div><div class="coin-edge" style="transform:translateZ(-2px)"></div><div class="coin-edge" style="transform:translateZ(0px)"></div><div class="coin-edge" style="transform:translateZ(2px)"></div><div class="coin-edge" style="transform:translateZ(4px)"></div>
          <div class="coin-face coin-heads"><b>✦</b><span>正面</span><small>DCCOOL · HEADS</small></div>
          <div class="coin-face coin-tails"><b>☾</b><span>反面</span><small>DCCOOL · TAILS</small></div>
        </div>
      </div>
      <div id="dice-stage" class="game-stage glass-scene" hidden aria-label="玻璃罩內的3D骰子"></div>
      <div id="game-status" class="game-status" role="status" aria-live="polite" hidden></div>
      <div class="buttons">
        <div id="dice-controls" hidden><label><input id="dice-count" type="number" min="1" max="10" step="1" value="1" aria-label="骰子顆數"> 顆骰子</label></div>
        <button id="spinButton">啟動轉盤</button>
      </div>
      <div id="timeDisplay">
        <div id="date"></div>
        <div id="time"></div>
      </div>
    </div>
    <div class="options-container">
      <textarea id="optionsInput" placeholder="請輸入抽籤選項，每行一個"></textarea>
      <div class="buttons">
        <button id="updateButton">更新轉盤</button>
        <div class="template-buttons">
          <button id="coinTemplate">擲硬幣</button>
          <button id="foodTemplate">點餐</button>
          <button id="gunTemplate">俄羅斯輪盤</button>
        </div>
        <div class="template-buttons">
          <button id="diceTemplate">骰子</button>
          <button id="playTemplate">聚會</button>
          <button id="weekTemplate">排假</button>
        </div>
      </div>
    </div>
  </div>
  <div class="result" id="resultBox"></div>
  <audio id="startSound" src="m/start-sound1.mp3"></audio>
  <audio id="resultSound" src="m/result-Sound.mp3"></audio>
  <audio id="gunshotSound" src="m/gunshot.mp3"></audio>
  <audio id="clickSound" src="m/click.mp3"></audio>
  <audio id="scoreSound" src="m/Sou.mp3"></audio>
  <audio id="coinSound" src="m/coin.mp3"></audio>
  <audio id="missSound" src="m/miss.mp3"></audio>
  <audio id="revolverSound" src="m/revolver.mp3"></audio>
  <audio id="revolver1Sound" src="m/revolver1.mp3"></audio>
  <audio id="diceSound" src="m/dice.mp3"></audio>
  <audio id="cheerSound" src="m/cheer.mp3" preload="none" muted></audio>
  <script>
    // 全域變數
    const wheel = document.getElementById("wheel");
    const spinButton = document.getElementById("spinButton");
    const updateButton = document.getElementById("updateButton");
    const optionsInput = document.getElementById("optionsInput");
    const resultBox = document.getElementById("resultBox");
    const gunshotSound = document.getElementById('gunshotSound');
    const coinSound = document.getElementById('coinSound');
    const clickSound = document.getElementById('clickSound');
    const scoreSound = document.getElementById('scoreSound');
    const missSound = document.getElementById('missSound');
    const revolverSound = document.getElementById('revolverSound');
    const revolver1Sound = document.getElementById('revolver1Sound');
    const diceSound = document.getElementById('diceSound');
    const cheerSound = document.getElementById("cheerSound");
    const sfxButton = document.getElementById('sfx-button');
    let cheerEnabled = false;
    cheerSound.muted = true;
    sfxButton.addEventListener('click', () => {
      cheerEnabled = !cheerEnabled;
      cheerSound.muted = !cheerEnabled;
      sfxButton.setAttribute('aria-pressed', String(cheerEnabled));
      sfxButton.textContent = cheerEnabled ? '音效：開' : '音效：關';
      if (!cheerEnabled) {
        cheerSound.pause();
        cheerSound.currentTime = 0;
      }
    });
    function playCheer() {
      // Check at playback time, including delayed result callbacks.
      if (!cheerEnabled) return;
      cheerSound.currentTime = 0;
      cheerSound.play().catch(() => {});
    }

    let useRevolverOverlay = true;
    let revolverOverlayImageUrl = "img/rmz.png";

    let options = ["1", "2", "3", "4", "5", "6"];
    let revolverMode = false;
    let revolverChambers = [];
    let spinning = false;
    let currentChamberIndex = 0;
    let currentRotationAngle = 0;
    let time = 0;
    let gameMode = 'wheel';
    let wheelButtonContent = null;


    function syncGameMode() {
      gameMode = options.length === 2 && options.includes('正面') && options.includes('反面') ? 'coin' : options.length === 6 && options[0] === '⚀' ? 'dice' : 'wheel';
      document.querySelector('.wheel-stage').hidden = gameMode !== 'wheel';
      document.getElementById('coin-stage').hidden = gameMode !== 'coin';
      document.getElementById('dice-stage').hidden = gameMode !== 'dice';
      document.getElementById('dice-controls').hidden = gameMode !== 'dice';
      const status = document.getElementById('game-status');
      status.hidden = gameMode === 'wheel';
      status.textContent = gameMode === 'coin' ? '翻轉硬幣，讓命運選一面' : '選擇 1～10 顆骰子';
      resultBox.style.display = 'none';
      if (gameMode !== 'wheel') {
        if (!wheelButtonContent) wheelButtonContent = Array.from(spinButton.childNodes);
        spinButton.textContent = gameMode === 'coin' ? '投擲硬幣' : '擲骰';
      } else if (wheelButtonContent) {
        spinButton.replaceChildren(...wheelButtonContent);
        wheelButtonContent = null;
      }
      if (gameMode === 'dice') renderDice(Array(readDiceCount()).fill(1));
    }
    function readDiceCount() {
      const input = document.getElementById('dice-count');
      const count = Math.max(1, Math.min(10, Math.floor(Number(input.value) || 1)));
      input.value = count;
      return count;
    }
    function randomOutcome(sides) {
      const buffer = new Uint32Array(1);
      const limit = Math.floor(4294967296 / sides) * sides;
      do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
      return buffer[0] % sides + 1;
    }
    function renderDice(values) {
      const stage = document.getElementById('dice-stage');
      stage.replaceChildren();
      const rows = {1:[1],2:[2],3:[3],4:[2,2],5:[2,3],6:[3,3],7:[2,3,2],8:[3,2,3],9:[3,3,3],10:[2,3,3,2]}[values.length];
      const pips = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
      const faces = {1:'',6:'rotateY(180deg)',2:'rotateY(90deg)',5:'rotateY(-90deg)',3:'rotateX(90deg)',4:'rotateX(-90deg)'};
      let index = 0;
      for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r]; c++) {
        const slot = document.createElement('div'); slot.className = 'die-slot';
        slot.style.left = (50 + (c-(rows[r]-1)/2)*22) + '%';
        slot.style.top = (50 + (r-(rows.length-1)/2)*20) + '%';
        const die = document.createElement('div'); die.className = 'die';
        die.setAttribute('role','img'); die.setAttribute('aria-label','骰子 ' + (++index));
        for (const [value, rotation] of Object.entries(faces)) {
          const face = document.createElement('div'); face.className='die-face'; face.dataset.value=value;
          face.style.transform = rotation + ' translateZ(calc(var(--size) / 2))';
          for (const pos of pips[value]) { const pip = document.createElement('i'); pip.className='pip'; pip.style.gridArea = Math.ceil(pos/3) + ' / ' + ((pos-1)%3+1); face.appendChild(pip); }
          die.appendChild(face);
        }
        slot.appendChild(die); stage.appendChild(slot);
      }
      return Array.from(stage.querySelectorAll('.die'));
    }
    async function run3DGame() {
      if (spinning) return;
      spinning = true;
      const controls = Array.from(document.querySelectorAll('.template-buttons button, #updateButton, .palette-btn, #dice-count, #spinButton'));
      controls.forEach(el => el.disabled = true);
      resultBox.style.display = 'none';
      const status = document.getElementById('game-status');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      try {
        if (gameMode === 'coin') {
          status.textContent = '硬幣翻轉中…';
          const result = randomOutcome(2);
          const coin = document.getElementById('coin-3d');
          const final = result === 1 ? 0 : 180;
          coinSound.currentTime = 0; coinSound.play().catch(()=>{});
          const animation = coin.animate(reduced ? [{opacity:.6},{opacity:1}] : [
            {transform:'translateY(0) rotateX(0deg) rotateY(0deg)'},
            {transform:'translateY(-35px) rotateX(900deg) rotateY(720deg)',offset:.35},
            {transform:'translateY(-15px) rotateX(1800deg) rotateY(1440deg)',offset:.7},
            {transform:'translateY(0) rotateX(2520deg) rotateY('+(2160+final)+'deg)'}
          ],{duration:4000,easing:'cubic-bezier(.16,.5,.3,1)',fill:'forwards'});
          await animation.finished;
          coin.style.transform = 'rotateY('+final+'deg)'; animation.cancel();
          status.textContent = '結果：' + (result === 1 ? '正面' : '反面');
          coin.setAttribute('aria-label',result === 1 ? '正面' : '反面');
        } else {
          status.textContent = '骰子翻動中…';
          const values = Array.from({length:readDiceCount()},()=>randomOutcome(6));
          const dice = renderDice(values);
          const rotations = {1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
          diceSound.currentTime=0; diceSound.play().catch(()=>{});
          await Promise.all(dice.map(async (die,i) => {
            const [rx,ry]=rotations[values[i]];
            const end='rotateX('+(720+rx)+'deg) rotateY('+(1080+ry)+'deg)';
            const animation=die.animate(reduced ? [{opacity:.6},{opacity:1}] : [
              {transform:'rotateX(0deg) rotateY(0deg)'},
              {transform:'translateY(-8px) rotateX(300deg) rotateY(470deg)',offset:.35},
              {transform:'translateY(4px) rotateX(600deg) rotateY(850deg)',offset:.7},
              {transform:end}
            ],{duration:2000,easing:'cubic-bezier(.2,.65,.3,1)',fill:'forwards'});
            await animation.finished;
            die.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'; animation.cancel();
            die.dataset.result=values[i]; die.setAttribute('aria-label','骰子 '+(i+1)+'：'+values[i]+' 點');
          }));
          status.textContent = values.join(' · ') + '　合計 '+values.reduce((a,b)=>a+b,0)+' 點';
        }
        playCheer();
      } finally {
        spinning=false; controls.forEach(el=>el.disabled=false);
      }
    }
    document.getElementById('dice-count').addEventListener('change',()=>{ if(!spinning) renderDice(Array(readDiceCount()).fill(1)); });
    document.querySelectorAll('.template-buttons button, #updateButton, .palette-btn').forEach(el=>el.addEventListener('click',event=>{ if(spinning) {event.preventDefault();event.stopImmediatePropagation();} },true));

    function isDarkColor(color) {
      const hex = color.replace("#", "");
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness < 128;
    }

    const palettes = {
      green: ["#234E46","#80AD94","#396F60","#C4D9BB","#5D9279","#E5E9CD"],
      pink: ["#75455F","#C18CA5","#975F7C","#E5BAC7","#B57D91","#F2DCD9"],
      blue: ["#264C68","#80ACBA","#446D8C","#C5DCE0","#6293AD","#E2E9E5"],
      yellow: ["#8C6233","#D9B563","#AE8645","#F1DDA4","#C89C54","#F7EAC9"],
      gray: ["#33434D","#A9B4B6","#64757E","#DDE1DC","#869699","#EFF0E9"],
      red: ["#763F42","#C78475","#A45C55","#E9B8A0","#BA7462","#F1D5BA"],
      gun: ["#151615","#151617"],
      coin: ["#cdcdcd","#bbbbbb"]
    };

    let userPalette = palettes.green;
    let colors = palettes.green;
    const colorPaletteBtn = document.getElementById('color-palette-btn');
    const colorPaletteContainer = document.getElementById('color-palette-container');
    const paletteButtons = document.querySelectorAll('.palette-btn');
    const paletteNames = {green:'森林鼠尾草',pink:'玫瑰奶茶',blue:'海岸晨霧',yellow:'蜂蜜燕麥',gray:'岩石銀灰',red:'陶土夕陽'};
    paletteButtons.forEach(button => { const p=palettes[button.dataset.palette]; button.style.background='conic-gradient('+p.join(',')+')'; button.title=paletteNames[button.dataset.palette]; button.setAttribute('aria-label',button.title); });

    colorPaletteBtn.addEventListener('click', () => {
      clickSound.currentTime = 0;
      clickSound.play().catch(error => console.warn('按鈕音效失敗:', error));
      colorPaletteContainer.classList.toggle('hidden');
    });

    paletteButtons.forEach(button => {
      button.addEventListener('click', () => {
        clickSound.currentTime = 0;
        clickSound.play().catch(error => console.warn('按鈕音效失敗:', error));
        const selectedPalette = button.getAttribute('data-palette');
        colors = palettes[selectedPalette];
        userPalette = colors;
        drawWheel();
        colorPaletteContainer.classList.add('hidden');
      });
    });

    function drawWheel() {
      syncGameMode();
      // 清空 SVG
      wheel.innerHTML = "";
      const numOptions = options.length;
      if (numOptions === 0) {
        alert('請輸入至少一個選項');
        return;
      }
      const angleStep = 360 / numOptions;
      for (let i = 0; i < numOptions; i++) {
        const angle = i * angleStep;
        const color = colors[i % colors.length];

        // 畫扇形
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", describeArc(150, 150, 150, angle, angle + angleStep));
        path.setAttribute("fill", color);
        path.setAttribute("stroke", "#ffffff55");
        path.setAttribute("stroke-width", "0.7");
        if (colors === palettes.coin) {
          path.setAttribute("stroke", "#A0A0A0");
          path.setAttribute("stroke-width", "3");
        }
        wheel.appendChild(path);

        // 添加文字
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        const textRadius = 110;
        const midAngle = angle + angleStep / 2;
        const x = 150 + textRadius * Math.cos((midAngle - 90) * Math.PI / 180);
        const y = 150 + textRadius * Math.sin((midAngle - 90) * Math.PI / 180);
        text.setAttribute("x", x);
        text.setAttribute("y", y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("transform", `rotate(${midAngle + 90}, ${x}, ${y})`);
        const optionText = options[i];
        let fontSize = "28px";
        if (options.length > 17) fontSize = "20px";
        else if (optionText.length > 3) fontSize = "24px";
        text.style.fontSize = fontSize;
        text.style.fontFamily = '"Roboto", "NaniFont-Regular", sans-serif';
        text.textContent = optionText;
        const textColor = isDarkColor(color) ? "#fff" : "#000";
        text.setAttribute("fill", textColor);
        wheel.appendChild(text);
      }

      if (revolverMode && useRevolverOverlay) {
        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "image");
        overlay.setAttributeNS(null, "href", revolverOverlayImageUrl);
        overlay.setAttribute("x", "-51");
        overlay.setAttribute("y", "-43");
        overlay.setAttribute("width", "400");
        overlay.setAttribute("height", "400");
        overlay.setAttribute("preserveAspectRatio", "xMidYMid meet");
        wheel.appendChild(overlay);
      }
    }

    function describeArc(x, y, radius, startAngle, endAngle) {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = (endAngle - startAngle + 360) % 360 > 180 ? "1" : "0";
      return [
        "M", x, y,
        "L", start.x, start.y,
        "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y,
        "Z"
      ].join(" ");
    }

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
      };
    }

    function getDesiredAngle(index) {
      const slice = 360 / 6;
      return 360 - (index * slice + slice / 2);
    }

    function spinWheel() {
      if (spinning) return;
      if (gameMode !== 'wheel') { run3DGame(); return; }
      spinning = true;
      console.log("spinWheel 執行時, 左輪模式 =", revolverMode);
      if (revolverMode) {
        let textElements = wheel.querySelectorAll('text');
        textElements.forEach(el => el.style.visibility = 'hidden');
        let currentResult = revolverChambers[currentChamberIndex];
        spinButton.disabled = true;
        spinButton.style.opacity = "0.5";
        spinButton.style.cursor = "not-allowed";
        if (currentChamberIndex === 0) {
          const desired = getDesiredAngle(0);
          const currentMod = currentRotationAngle % 360;
          let additional = desired - currentMod;
          if (additional < 0) additional += 360;
          const targetAngle = currentRotationAngle + 360 * 4 + additional;
          const animationName = "leftSpinAnim_" + Date.now();
          const keyframes = `
            @keyframes ${animationName} {
              from { transform: rotate(${currentRotationAngle}deg); }
              to { transform: rotate(${targetAngle}deg); }
            }
          `;
          const styleElem = document.createElement("style");
          styleElem.innerHTML = keyframes;
          document.head.appendChild(styleElem);
          wheel.style.animation = `${animationName} 3s cubic-bezier(0.2, 1, 0.3, 1) forwards`;
          currentRotationAngle = targetAngle;
          revolverSound.currentTime = 0;
          revolverSound.play().catch(err => console.warn(err));
          setTimeout(() => {
            wheel.style.animation = "";
            wheel.style.transform = `rotate(${currentRotationAngle}deg)`;
            styleElem.parentNode.removeChild(styleElem);
            resultBox.style.display = "flex";
            resultBox.textContent = "抽中: " + currentResult;
            if (currentResult === '💥') {
              gunshotSound.currentTime = 0;
              gunshotSound.play().catch(err => console.warn(err));
              confetti({
                particleCount: 100,
                colors: ['#ff0000'],
                spread: 70,
                origin: { x: 0.5, y: 0.5 }
              });
              setTimeout(() => {
                resultBox.textContent = "遊戲結束";
                setTimeout(() => {
                  resultBox.style.display = "none";
                  resetLeftMode();
                }, 2000);
              }, 2000);
            } else if (currentResult === 'MISS') {
              missSound.currentTime = 0;
              missSound.play().catch(err => console.warn(err));
              currentChamberIndex++;
              setTimeout(() => {
                resultBox.style.display = "none";
                spinning = false;
                spinButton.disabled = false;
                spinButton.style.opacity = "1";
                spinButton.style.cursor = "pointer";
              }, 2000);
            }
          }, 3000);
        } else {
          const cellAngle = 360 / 6;
          const targetAngle = currentRotationAngle + cellAngle;
          wheel.style.transition = "transform 2s cubic-bezier(0.2, 1, 0.3, 1)";
          wheel.style.transform = `rotate(${targetAngle}deg)`;
          revolver1Sound.currentTime = 0;
          revolver1Sound.play().catch(err => console.warn(err));
          setTimeout(() => {
            currentRotationAngle = targetAngle;
            resultBox.style.display = "flex";
            resultBox.textContent = "抽中: " + currentResult;
            if (currentResult === '💥') {
              gunshotSound.currentTime = 0;
              gunshotSound.play().catch(err => console.warn(err));
              confetti({
                particleCount: 100,
                colors: ['#ff0000'],
                spread: 70,
                origin: { x: 0.5, y: 0.5 }
              });
              setTimeout(() => {
                resultBox.textContent = "遊戲結束";
                setTimeout(() => {
                  resultBox.style.display = "none";
                  resetLeftMode();
                }, 2000);
              }, 2000);
            } else if (currentResult === 'MISS') {
              missSound.currentTime = 0;
              missSound.play().catch(err => console.warn(err));
              currentChamberIndex++;
              setTimeout(() => {
                resultBox.style.display = "none";
                spinning = false;
                spinButton.disabled = false;
                spinButton.style.opacity = "1";
                spinButton.style.cursor = "pointer";
              }, 2000);
            }
          }, 2000);
        }
        return;
      }
      normalSpin();
    }

    function resetLeftMode() {
      revolverMode = false;
      revolverChambers = [];
      options = ["1", "2", "3", "4", "5", "6"];
      colors = userPalette;
      drawWheel();
      currentRotationAngle = 0;
      currentChamberIndex = 0;
      spinning = false;
      spinButton.disabled = false;
      spinButton.style.opacity = "1";
      spinButton.style.cursor = "pointer";
    }

    function normalSpin() {
      const items = options;
      const isCoinFlip = items.length === 2 && items.includes('正面') && items.includes('反面');
      const isDice = items.length === 6 && items[0] === "⚀";
      if (isCoinFlip) {
        coinSound.currentTime = 0;
        coinSound.play().catch(error => console.warn('硬幣音效失敗:', error));
      } else if (isDice) {
        diceSound.currentTime = 0;
        diceSound.play().catch(error => console.warn('骰子音效失敗:', error));
      } else {
        startSound.currentTime = 0;
        startSound.play().catch(error => console.warn('開始音效失敗:', error));
      }
      spinButton.disabled = true;
      spinButton.style.opacity = "0.5";
      spinButton.style.cursor = "not-allowed";
      wheel.style.transition = "none";
      wheel.style.transform = "rotate(0deg)";
      const numOptions = options.length;
      const randomIndex = Math.floor(Math.random() * numOptions);
      const sliceDegree = 360 / numOptions;
      const targetDegree = 360 - (randomIndex * sliceDegree + sliceDegree / 2);
      const spinDegree = 360 * 12 + targetDegree;
      setTimeout(() => {
        if (isCoinFlip) {
          wheel.style.transition = "transform 3.6s ease-out";
        } else if (isDice) {
          wheel.style.transition = "transform 1.7s ease-out";
        } else {
          wheel.style.transition = "transform 7.5s ease-out";
        }
        wheel.style.transform = `rotate(${spinDegree}deg)`;
        setTimeout(() => {
          resultBox.textContent = `抽中: ${options[randomIndex]}`;
          resultBox.style.display = "flex";
          if (options[randomIndex] === '💥') {
            gunshotSound.currentTime = 0;
            gunshotSound.play().catch(error => console.warn('槍聲失敗:', error));
            confetti({
              particleCount: 100,
              colors: ['#ff0000'],
              spread: 70,
              origin: { x: 0.5, y: 0.5 }
            });
          } else {
            resultSound.currentTime = 0;
            resultSound.play().catch(error => console.warn('結果音效失敗:', error));
            const cheerSound = document.getElementById("cheerSound");
            setTimeout(() => {
              playCheer();
            }, 500);
          }
          showConfetti();
          setTimeout(() => {
            resultBox.style.display = "none";
            spinning = false;
            spinButton.disabled = false;
            spinButton.style.opacity = "1";
            spinButton.style.cursor = "pointer";
          }, isCoinFlip ? 3600 : isDice ? 1700 : 3600);
        }, isCoinFlip ? 3600 : isDice ? 1700 : 7500);
      }, 10);
    }

    function describeArc(x, y, radius, startAngle, endAngle) {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = (endAngle - startAngle + 360) % 360 > 180 ? "1" : "0";
      return [
        "M", x, y,
        "L", start.x, start.y,
        "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y,
        "Z"
      ].join(" ");
    }

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
      };
    }


const btnText = spinButton.textContent.trim(); 
spinButton.textContent = "";
btnText.split("").forEach(ch => {
  const span = document.createElement("span");
  span.textContent = ch;
  span.dataset.char = ch;
  span.style.display = "inline-block";
  span.style.cursor = "pointer";
  span.style.userSelect = "none";
  spinButton.appendChild(span);
});
const charTargets = {
  "啟": ["小何"],
  "動": ["翔哥", "韋翔", "129"],
  "轉": ["小羊"],
  "盤": ["小伍"]
};
spinButton.querySelectorAll("span").forEach(span => {
  span.addEventListener("click", e => {
    e.stopPropagation();    
    const ch = span.dataset.char; 
    const targets = charTargets[ch] || [];
    const pick = targets.find(name => options.includes(name));
    if (pick) {
      const idx = options.indexOf(pick);
      cheatSpinToIndex(idx, pick);
    } else {
      spinWheel();
    }
  });
});

function cheatSpinToIndex(index, label) {
  const numOptions = options.length;
  const sliceDegree = 360 / numOptions;
  const targetDegree = 360 - (index * sliceDegree + sliceDegree / 2);
  const spinDegree = 360 * 12 + targetDegree;

  startSound.currentTime = 0;
  startSound.play().catch(() => {});

  spinButton.disabled = true;
  spinButton.style.opacity = "0.5";
  spinButton.style.cursor = "not-allowed";
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";

  setTimeout(() => {
    wheel.style.transition = "transform 7.5s ease-out";
    wheel.style.transform = `rotate(${spinDegree}deg)`;
    setTimeout(() => {
      resultBox.textContent = `抽中: ${label}`;

        resultBox.style.display = "none";
        spinning = false;
        spinButton.disabled = false;
        spinButton.style.opacity = "1";
        spinButton.style.cursor = "pointer";
      }, 3600);
    }, 7500);
  }, 10);
}

    function updateClock() {

    volumeSlider.addEventListener('input', (event) => {

      if (volume === 0) {
        bgmButton.textContent = muteIcon;
      } else {

      }
    });

//背景
    var fishCanvas = document.getElementById('fishCanvas');
    var fishCtx = fishCanvas.getContext('2d');
    var selectedHexagons = [];
    let hoveredHexagonsMap = {};
    var mouseX = -1;
    var mouseY = -1;

function resizeCanvas() {
        fishCanvas.width = window.innerWidth;
        fishCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawHexagon(ctx, centerX, centerY, radius, fillStyle) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i - Math.PI / 6;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function drawHexagonGrid(ctx, canvasWidth, canvasHeight, radius, time) {
    const hexWidth = 1.7 * radius;
    const hexHeight = Math.sqrt(3.1) * radius;
    let currentHovered = {};

    for (let row = 0; row < canvasHeight / (hexHeight * 0.8) + 1; row++) {
        const offsetX = (row % 2) * (hexWidth / 2);
        for (let col = 0; col < canvasWidth / hexWidth + 1; col++) {
            const centerX = col * hexWidth + offsetX;
            const centerY = row * (hexHeight * 0.85);
            const waveX = Math.sin(centerX * 0.01 + time) * 3;
            const waveY = Math.cos(centerY * 0.01 + time) * 3;
            let opacity = 0.08 + (Math.sin(centerX * 0.01 + centerY * 0.01 + time) * 0.021);
            let baseR = 70, baseG = 220, baseB = 255;
            let fillStyle = `rgba(${baseR}, ${baseG}, ${baseB}, ${opacity})`;
            let glowOpacity = 0;
            let effectiveRadius = radius;

            const actualCenterX = centerX + waveX;
            const actualCenterY = centerY + waveY;
            const dx = mouseX - actualCenterX;
            const dy = mouseY - actualCenterY;
            const key = `${row}-${col}`;
            if (Math.sqrt(dx * dx + dy * dy) < radius * 1.2) {
                if (!hoveredHexagonsMap[key]) {
                    hoveredHexagonsMap[key] = { col, row, startTime: performance.now() };
                }
                currentHovered[key] = hoveredHexagonsMap[key];
            }

            let isSelected = false;
            for (let hex of selectedHexagons) {
                if (hex.col === col && hex.row === row) {
                    isSelected = true;
                    const elapsed = (performance.now() - hex.startTime) / 1000;
                    if (elapsed < 1) {
                        let blendFactor = elapsed;
                        fillStyle = `rgba(${70 + blendFactor * (190 - 70)}, ${220 + blendFactor * (250 - 220)}, ${255}, ${opacity + blendFactor * (0.2 - opacity)})`;
                        glowOpacity = blendFactor * 0.2;
                    } else if (elapsed < 2) {
                        fillStyle = `rgba(190, 250, 255, 0.2)`;
                        glowOpacity = 0.2;
                    } else if (elapsed < 3) {
                        let blendFactor = 1 - (elapsed - 2);
                        fillStyle = `rgba(${70 + blendFactor * (255 - 70)}, ${220 + blendFactor * (255 - 220)}, ${255}, ${opacity + blendFactor * (0.2 - opacity)})`;
                        glowOpacity = blendFactor * 0.2;
                    }
                    break;
                }
            }
            if (!isSelected && hoveredHexagonsMap[key]) {
                let intensity = 0;
                if (currentHovered[key]) {
                    intensity = 1;
                } else {
                    const elapsed = (performance.now() - hoveredHexagonsMap[key].startTime) / 1000;
                    if (elapsed < 3) {
                        intensity = 1 - (elapsed / 3);
                    }
                }
                let targetR = baseR + 0.1 * (255 - baseR);
                let targetG = baseG + 0.1 * (255 - baseG);
                let targetB = baseB; 
                let newR = Math.round(baseR + intensity * (targetR - baseR));
                let newG = Math.round(baseG + intensity * (targetG - baseG));
                let newB = Math.round(baseB + intensity * (targetB - baseB));
                fillStyle = `rgba(${newR}, ${newG}, ${newB}, ${opacity})`;
                effectiveRadius = radius * (1 + 0.05 * intensity);
                glowOpacity = 0.1 * intensity;
            }
            if (glowOpacity > 0) {
                drawGlow(ctx, actualCenterX, actualCenterY, radius * 1.5, glowOpacity);
            }
            drawHexagon(ctx, actualCenterX, actualCenterY, effectiveRadius, fillStyle);
        }
    }
    for (let key in hoveredHexagonsMap) {
        if (!currentHovered[key]) {
            if ((performance.now() - hoveredHexagonsMap[key].startTime) / 1000 > 3) {
                delete hoveredHexagonsMap[key];
            }
        }
    }
    selectedHexagons = selectedHexagons.filter(hex => (performance.now() - hex.startTime) / 1000 < 3);
}


function drawGlow(ctx, centerX, centerY, radius, opacity) {
  let gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius);
  gradient.addColorStop(0, `rgba(190, 250, 255, ${opacity * 0.8})`);
  gradient.addColorStop(1, `rgba(190, 250, 255, 0)`); 

  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
}

function updateSelectedHexagons() {
  const hexWidth = 1.70 * 45;
  const hexHeight = Math.sqrt(3) * 45;
        
  let randomCol = Math.floor(Math.random() * (fishCanvas.width / hexWidth));
  let randomRow = Math.floor(Math.random() * (fishCanvas.height / hexHeight));

  selectedHexagons.push({ col: randomCol, row: randomRow, startTime: performance.now() });

  setTimeout(updateSelectedHexagons, 1000);
}

function animateBackground() {
  time += 0.02;
  fishCtx.clearRect(0, 0, fishCanvas.width, fishCanvas.height);
  drawHexagonGrid(fishCtx, fishCanvas.width, fishCanvas.height, 45, time);
  requestAnimationFrame(animateBackground);
}

function handleMouseMove(event) {
  const rect = fishCanvas.getBoundingClientRect();
  mouseX = event.clientX - rect.left;
  mouseY = event.clientY - rect.top;
}

function handleMouseLeave() {
  mouseX = -1;
  mouseY = -1;
}

fishCanvas.addEventListener("mousemove", handleMouseMove);
fishCanvas.addEventListener("mouseleave", handleMouseLeave);

  animateBackground();
  updateSelectedHexagons();
  </script>
