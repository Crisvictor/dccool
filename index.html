<script>
  // 員工資料不再內嵌於 HTML。圖形驗證通過後，才向同網域讀取加密資料檔。
  const DATA_URL = 'data/employees.enc.json';
  const DATA_AAD = 'OKURA-COOL-HR-v1';
  const IDLE_TIMEOUT_MS = 15 * 60 * 1000;
  const MAX_DATA_PASSWORD_ATTEMPTS = 5;
  let employees = [];
  let dataPasswordAttempts = 0;
  let dataCooldownTimer = null;
  let idleTimer = null;
  let appUnlocked = false;
  let resignedSearchMode = false;
  let secretTapCount = 0;
  let secretTapTimer = null;

  function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function deriveDataKey(password, salt, iterations) {
    const material = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(password),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );

    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      material,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  function validateEncryptedEnvelope(envelope) {
    if (!envelope || envelope.version !== 1) throw new Error('UNSUPPORTED_DATA_FORMAT');
    if (envelope.kdf?.name !== 'PBKDF2' || envelope.kdf?.hash !== 'SHA-256') {
      throw new Error('UNSUPPORTED_KDF');
    }
    if (!Number.isInteger(envelope.kdf.iterations) || envelope.kdf.iterations < 100000) {
      throw new Error('INVALID_KDF');
    }
    if (envelope.cipher?.name !== 'AES-GCM') throw new Error('UNSUPPORTED_CIPHER');
    if (envelope.cipher?.aad !== DATA_AAD) throw new Error('INVALID_AAD');
    if (!envelope.kdf.salt || !envelope.cipher.iv || !envelope.data) {
      throw new Error('INVALID_ENVELOPE');
    }
  }

  async function loadEncryptedEmployees(password) {
    let response;
    try {
      response = await fetch(DATA_URL, {
        method: 'GET',
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
    } catch (error) {
      throw new Error('DATA_NETWORK_ERROR');
    }

    if (!response.ok) throw new Error(`DATA_HTTP_${response.status}`);

    const envelope = await response.json();
    validateEncryptedEnvelope(envelope);

    const salt = base64ToBytes(envelope.kdf.salt);
    const iv = base64ToBytes(envelope.cipher.iv);
    const ciphertext = base64ToBytes(envelope.data);
    const key = await deriveDataKey(password, salt, envelope.kdf.iterations);

    let plaintext;
    try {
      plaintext = await crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv,
          additionalData: new TextEncoder().encode(DATA_AAD),
          tagLength: 128
        },
        key,
        ciphertext
      );
    } catch (error) {
      throw new Error('DATA_DECRYPT_FAILED');
    }

    const payload = JSON.parse(new TextDecoder().decode(plaintext));
    if (!payload || !Array.isArray(payload.employees)) throw new Error('INVALID_EMPLOYEE_DATA');

    return payload.employees.map((employee) => Object.freeze({
      ...employee,
      id: String(employee.id ?? ''),
      branch: String(employee.branch ?? ''),
      name: String(employee.name ?? ''),
      dateOfEntry: String(employee.dateOfEntry ?? '')
    }));
  }

const HIT_RATIO = 0.76;         
const REQUIRED_LEN = 4;     

const SECRET_PI = Uint8Array.from([7,2,9,4,5,6,1,8,3]); 
const mapId = (i) => SECRET_PI[i - 1];
const PEPPER = atob('cDNwUGVyIzIwMjU='); 
const STORED_HEX = atob('YmNmZDIzNTZhNzNlNzA3ZGY5YmQ5YmViYTYzOGVlNGVhNDIxOTFlYzM5MjNiZGJjZGM2OTY1YmQwMjVjMzA2YQ==');


async function sha256Hex(str) {
  const data = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function verifyPattern(inputNums) {
  const logical = inputNums.map(mapId).join('-');
  const hex = await sha256Hex(PEPPER + '|' + logical);
  return hex === STORED_HEX;
}

// -------- 狀態 --------
let currentInput = [];
let previousDot = null;
let skipNextEndError = false;
let dotGeom = [];
let centerByEl = new Map();


function computeDotGeom() {
  dotGeom = dots.map(el => {
    const r = el.getBoundingClientRect();
    const radius = Math.min(r.width, r.height) / 2 * HIT_RATIO;
    const info = { el, cx: r.left + r.width/2, cy: r.top + r.height/2, radius };
    centerByEl.set(el, info);
    return info;
  });
}
function hitTestDot(x, y) {
  let best = null, bestD2 = Infinity;
  for (const d of dotGeom) {
    const dx = x - d.cx, dy = y - d.cy;
    const d2 = dx*dx + dy*dy;
    if (d2 <= d.radius * d.radius && d2 < bestD2) {
      best = d; bestD2 = d2;
    }
  }
  return best ? best.el : null;
}


async function checkPassword() {
  const ok = await verifyPattern(currentInput);
  if (ok) {
    var successAudio = document.getElementById('successAudio');
    successAudio.play();
    document.getElementById('unlockMessage').textContent = '圖形解鎖成功';
    document.getElementById('unlockMessage').classList.remove('hidden');

    }, 800);
  } else {
    const em = document.getElementById('errorMessage');
    em?.classList.remove('hidden');
    setTimeout(() => em?.classList.add('hidden'), 2000);
    resetDots();
  }
  currentInput = [];
  previousDot = null;
}

// -------- 畫線 / 重置（保留你的原樣）--------
function drawLine(fromDot, toDot) {
  const grid = document.getElementById('grid');
  const fromRect = fromDot.getBoundingClientRect();
  const toRect = toDot.getBoundingClientRect();

  const fromX = fromRect.left + fromRect.width / 2;
  const fromY = fromRect.top + fromRect.height / 2;
  const toX = toRect.left + toRect.width / 2;
  const toY = toRect.top + toRect.height / 2;

  const length = Math.sqrt((toX - fromX) ** 2 + (toY - fromY) ** 2);
  const angle = Math.atan2(toY - fromY, toX - fromX) * (180 / Math.PI);

  const line = document.createElement('div');
  line.classList.add('line');
  line.style.width = `${length}px`;
  line.style.transform = `rotate(${angle}deg)`;
  line.style.left = `${fromX - grid.getBoundingClientRect().left}px`;
  line.style.top  = `${fromY - grid.getBoundingClientRect().top }px`;

  grid.appendChild(line);
}
function resetDots() {
  document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
  document.querySelectorAll('.line').forEach(line => line.remove());
}

const gridEl = document.getElementById('grid');
const dots = [...gridEl.querySelectorAll('.dot')];
const dotById = Object.fromEntries(dots.map(d => [d.dataset.value, d]));
const bridge = {
  '1-3':2,'3-1':2, '1-7':4,'7-1':4, '3-9':6,'9-3':6, '7-9':8,'9-7':8,
  '1-9':5,'9-1':5, '3-7':5,'7-3':5, '2-8':5,'8-2':5, '4-6':5,'6-4':5
};
let drawing = false;
let cursorLine = null;
let pointerIdInUse = null;

function makeCursorLine() {
  if (cursorLine) return cursorLine;
  cursorLine = document.createElement('div');
  cursorLine.className = 'line';
  cursorLine.style.opacity = '0.7';
  gridEl.appendChild(cursorLine);
  return cursorLine;
}
function updateCursorLine(fromDot, clientX, clientY) {
  if (!fromDot) return;
  const gridRect = gridEl.getBoundingClientRect();
  const from = fromDot.getBoundingClientRect();
  const fromX = from.left + from.width / 2;
  const fromY = from.top + from.height / 2;
  const dx = clientX - fromX;
  const dy = clientY - fromY;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;

  const line = makeCursorLine();
  line.style.width = `${len}px`;
  line.style.transform = `rotate(${ang}deg)`;
  line.style.left = `${fromX - gridRect.left}px`;
  line.style.top  = `${fromY - gridRect.top }px`;
}
function clearCursorLine() {
  if (cursorLine) { cursorLine.remove(); cursorLine = null; }
}

function addDot(dotEl) {
  const id = dotEl.dataset.value;
  if (currentInput.includes(+id)) return;

  if (previousDot) {
    const prevId = previousDot.dataset.value;
    const key = `${prevId}-${id}`;
    const mid = bridge[key];
    if (mid && !currentInput.includes(+mid)) {
      const midEl = dotById[mid];
      midEl.classList.add('active');
      currentInput.push(+mid);
      drawLine(previousDot, midEl);
      previousDot = midEl;
    }
    drawLine(previousDot, dotEl);
  }

  var audio = document.getElementById('audioPlayer');
  audio.currentTime = 0; audio.play();
  dotEl.classList.add('active');
  currentInput.push(+id);
  previousDot = dotEl;

  if (currentInput.length === REQUIRED_LEN) {
    skipNextEndError = true;
    drawing = false;
    gridEl.releasePointerCapture?.(pointerIdInUse);
    pointerIdInUse = null;
    clearCursorLine();
    checkPassword();
  }
}

function startPattern(e) {
  e.preventDefault();
  skipNextEndError = false;
  computeDotGeom();
  if (drawing) return;
  drawing = true;
  pointerIdInUse = e.pointerId;
  gridEl.setPointerCapture?.(pointerIdInUse);

  resetDots();
  currentInput = [];
  previousDot = null;

  const targetDot = hitTestDot(e.clientX, e.clientY);
  if (targetDot) addDot(targetDot);
}
function movePattern(e) {
  if (!drawing || e.pointerId !== pointerIdInUse) return;
  updateCursorLine(previousDot, e.clientX, e.clientY);
  const targetDot = hitTestDot(e.clientX, e.clientY);
  if (targetDot) addDot(targetDot);
}
function endPattern(e) {
  if (skipNextEndError) { skipNextEndError = false; return; }
  if (!drawing || e.pointerId !== pointerIdInUse) return;

  drawing = false;
  pointerIdInUse = null;
  clearCursorLine();

  if (currentInput.length > 0 && currentInput.length < REQUIRED_LEN) {
    const em = document.getElementById('errorMessage');
    em?.classList.remove('hidden');
    setTimeout(() => em?.classList.add('hidden'), 1500);
    resetDots();
    currentInput = [];
    previousDot = null;
  }
}

/**
 * 判斷到職日至今日是否未滿六個曆月。
 * 使用本機日期計算，避免 YYYY-MM-DD 被解析成 UTC 後產生日期偏移。
 */
function isNewHireWithinSixMonths(dateString) {
  const match = String(dateString || '').match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})$/
  );

  if (!match) return false;

  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);

  const entryDate = new Date(year, month - 1, day);
  entryDate.setHours(0, 0, 0, 0);

  // 排除無效日期，例如 2026-02-31。
  if (
    entryDate.getFullYear() !== year ||
    entryDate.getMonth() !== month - 1 ||
    entryDate.getDate() !== day
  ) {
    return false;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 未來日期不列入新進人員。
  if (entryDate > today) return false;

  // 計算到職滿六個月的日期。
  const sixMonthAnniversary = new Date(
    entryDate.getFullYear(),
    entryDate.getMonth() + 6,
    1
  );

  const lastDayOfTargetMonth = new Date(
    sixMonthAnniversary.getFullYear(),
    sixMonthAnniversary.getMonth() + 1,
    0
  ).getDate();

  sixMonthAnniversary.setDate(
    Math.min(entryDate.getDate(), lastDayOfTargetMonth)
  );

  return today < sixMonthAnniversary;
}

  }
});
